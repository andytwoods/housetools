{% if profiles %}
  <div class="mt-4 border shadow bg-faded p-4">
    <h2>Soundbar</h2>
    {% if not auth.is_connected %}
      <p class="text-danger">Not connected to SmartThings.</p>
    {% endif %}

    <div class="d-flex flex-wrap gap-2 mt-3">
      {% for profile in profiles %}
        <button type="button" class="btn btn-primary"
                title="{{ profile.summary }}"
                hx-post="{% url 'soundbar:apply-profile' profile.pk %}"
                hx-target="#soundbar-result"
                hx-swap="innerHTML"
                hx-disabled-elt="this"
                {% if not auth.is_connected %}disabled{% endif %}>
          {{ profile.name }}
        </button>
      {% endfor %}
    </div>

    <div id="soundbar-result" class="mt-3"></div>
  </div>
{% endif %}
