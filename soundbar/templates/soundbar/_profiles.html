{% if profiles %}
  <div class="mt-4 border shadow bg-faded p-4">
    <h2>Soundbar</h2>
    {% if not auth.is_connected %}
      <p class="text-danger">Not connected to SmartThings.</p>
    {% endif %}

    <div class="d-flex flex-wrap gap-2 mt-3">
      {% for profile in profiles %}
        <form method="post" action="{% url 'soundbar:apply-profile' profile.pk %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.path }}">
          <button type="submit" class="btn btn-primary" title="{{ profile.summary }}"
                  {% if not auth.is_connected %}disabled{% endif %}>
            {{ profile.name }}
          </button>
        </form>
      {% endfor %}
    </div>
  </div>
{% endif %}
