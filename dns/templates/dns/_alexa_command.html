<div class="mt-4 border shadow bg-faded p-4">
  <h2>Alexa voice commands</h2>
  <p class="text-muted">Type what you would say after "Alexa". The Echo you pick does it and answers out loud.</p>
  {% if error %}
    <p class="text-danger">{{ error }}</p>
  {% else %}
  <form hx-post="/alexa-command/" hx-target="#alexa-command-result" class="mt-4">
    <div class="mb-3">
      <label for="device" class="form-label">Echo:</label>
      <select name="device" id="device" class="form-select" required>
        {% for name in devices %}
          <option value="{{ name }}" {% if name == 'Kitchen' %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label for="command" class="form-label">Command:</label>
      <input type="text" name="command" id="command" class="form-control" required
             placeholder="what's the weather today">
    </div>
    <button type="submit" class="btn btn-primary">Send</button>
    <div id="alexa-command-result" class="mt-3"></div>
  </form>
  {% endif %}
</div>
